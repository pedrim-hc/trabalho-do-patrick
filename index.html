<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Urna de Faz-de-Conta (simulação fictícia)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3b3d38;font-family:"Courier New",Courier,monospace;color:#1d1f1a}
#banner{height:5%;min-height:22px;background:#2a2c27;color:#cfd1c6;border-bottom:2px solid #000;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:13px;letter-spacing:1px;text-align:center}
#machine{height:95%;display:-webkit-flex;display:flex;padding:14px;gap:14px}
#screen{-webkit-flex:1 1 62%;flex:1 1 62%;margin-right:14px;background:#c9d1bd;border:8px solid #1d1f1a;border-radius:6px;padding:16px 22px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
#screen h1{margin:0;font-size:22px;border-bottom:3px solid #1d1f1a;padding-bottom:8px}
#cargo{margin:14px 0 6px;font-size:18px}
#cargo b{font-size:24px;display:block;margin-top:4px}
#digits{display:-webkit-flex;display:flex;margin:12px 0}
.d{width:78px;height:74px;border:4px solid #1d1f1a;background:#e6ecd9;margin-right:10px;font-size:48px;font-weight:bold;text-align:center;line-height:66px}
#msg{font-size:20px;min-height:56px;font-weight:bold}
#foot{margin-top:auto;font-size:12px;border-top:2px dashed #1d1f1a;padding-top:8px}
#pad{-webkit-flex:1 1 38%;flex:1 1 38%;background:#8d8f86;border:6px solid #1d1f1a;border-radius:6px;padding:12px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#keys{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.k{width:30%;margin:1.5%;height:0;padding-bottom:17%;position:relative}
.k button{position:absolute;left:0;top:0;width:100%;height:100%;font:bold 34px "Courier New",monospace;background:#2c2e29;color:#f1f1e8;border:0;border-bottom:6px solid #000;border-radius:8px}
.k button:active{background:#555;border-bottom-width:2px;-webkit-transform:translateY(4px);transform:translateY(4px)}
#acts{display:-webkit-flex;display:flex;margin-top:auto}
.a{-webkit-flex:1;flex:1;margin:4px;height:64px;border:0;border-bottom:6px solid rgba(0,0,0,.6);border-radius:8px;font:bold 17px "Courier New",monospace;color:#111}
.a:active{-webkit-transform:translateY(4px);transform:translateY(4px);border-bottom-width:2px}
#bb{background:#f4f4ee}#bc{background:#e8872b}#bo{background:#42b050}
/* cena */
#scene{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#7ec8ff;z-index:9;overflow:hidden}
#scene.on{display:block}
#sky{position:absolute;left:0;top:0;width:100%;height:100%}
#flag{position:absolute;top:0;left:0;right:0;background:#f2c200;border-bottom:4px solid #111;text-align:center;font-weight:bold;font-size:18px;padding:8px;z-index:3}
#mapw{position:absolute;left:50%;top:50%;width:46vh;height:46vh;margin:-23vh 0 0 -23vh;z-index:2}
#mapw svg{width:100%;height:100%}
#ground{position:absolute;left:0;bottom:0;width:100%;height:22%;background:#5aa04a;border-top:5px solid #111}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;opacity:0;z-index:4}
#r1{width:60vh;height:60vh;margin:-30vh 0 0 -30vh;background:#fff}
#r2{width:56vh;height:56vh;margin:-28vh 0 0 -28vh;background:#ffd21f;border:6px solid #111}
#r3{width:38vh;height:38vh;margin:-19vh 0 0 -19vh;background:#ff6a1a;border:6px solid #111}
#r4{width:20vh;height:20vh;margin:-10vh 0 0 -10vh;background:#fff3a0;border:6px solid #111}
#boom{position:absolute;left:0;right:0;top:50%;margin-top:-9vh;text-align:center;font:bold 18vh Impact,"Arial Black",sans-serif;color:#e21b1b;-webkit-text-stroke:5px #111;text-shadow:6px 6px 0 #111;opacity:0;z-index:6;-webkit-transform:rotate(-8deg);transform:rotate(-8deg)}
.bit{position:absolute;left:50%;top:50%;width:7vh;height:7vh;background:#555;border:4px solid #111;opacity:0;z-index:5}
#after{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-weight:bold;font-size:24px;z-index:6;opacity:0}
#after span{background:#fff;border:4px solid #111;padding:8px 16px;display:inline-block}
.go1{-webkit-animation:flash .3s ease-out forwards;animation:flash .3s ease-out forwards}
.go2{-webkit-animation:pop .5s ease-out .05s forwards;animation:pop .5s ease-out .05s forwards}
.go3{-webkit-animation:pop .5s ease-out .1s forwards;animation:pop .5s ease-out .1s forwards}
.go4{-webkit-animation:pop .5s ease-out .15s forwards;animation:pop .5s ease-out .15s forwards}
.go5{-webkit-animation:pop .5s ease-out .2s forwards;animation:pop .5s ease-out .2s forwards}
.goB{-webkit-animation:bm .7s ease-out .1s forwards;animation:bm .7s ease-out .1s forwards}
.goA{-webkit-animation:fadein .3s ease-out .8s forwards;animation:fadein .3s ease-out .8s forwards}
.wob{-webkit-animation:wob .12s linear infinite;animation:wob .12s linear infinite}
.shake{-webkit-animation:shk .09s linear infinite;animation:shk .09s linear infinite}
.charred svg polygon{fill:#2a2a2a}
.charred #mapw{-webkit-animation:spin 1s ease-out forwards;animation:spin 1s ease-out forwards}
@-webkit-keyframes wob{0%{-webkit-transform:rotate(-3deg)}50%{-webkit-transform:rotate(3deg)}100%{-webkit-transform:rotate(-3deg)}}
@keyframes wob{0%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}
@-webkit-keyframes shk{0%{-webkit-transform:translate(8px,-6px)}33%{-webkit-transform:translate(-8px,6px)}66%{-webkit-transform:translate(6px,8px)}100%{-webkit-transform:translate(8px,-6px)}}
@keyframes shk{0%{transform:translate(8px,-6px)}33%{transform:translate(-8px,6px)}66%{transform:translate(6px,8px)}100%{transform:translate(8px,-6px)}}
@-webkit-keyframes flash{0%{opacity:1;-webkit-transform:scale(.2)}100%{opacity:0;-webkit-transform:scale(2.4)}}
@keyframes flash{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
@-webkit-keyframes pop{0%{opacity:1;-webkit-transform:scale(.1)}60%{opacity:1;-webkit-transform:scale(1.15)}100%{opacity:.95;-webkit-transform:scale(1)}}
@keyframes pop{0%{opacity:1;transform:scale(.1)}60%{opacity:1;transform:scale(1.15)}100%{opacity:.95;transform:scale(1)}}
@-webkit-keyframes bm{0%{opacity:1;-webkit-transform:scale(.2) rotate(-8deg)}30%{-webkit-transform:scale(1.25) rotate(-8deg)}100%{opacity:1;-webkit-transform:scale(1) rotate(-8deg)}}
@keyframes bm{0%{opacity:1;transform:scale(.2) rotate(-8deg)}30%{transform:scale(1.25) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@-webkit-keyframes fadein{to{opacity:1}}
@keyframes fadein{to{opacity:1}}
@-webkit-keyframes spin{0%{-webkit-transform:translate(0,0) rotate(0)}100%{-webkit-transform:translate(0,-12vh) rotate(25deg) scale(.85)}}
@keyframes spin{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(0,-12vh) rotate(25deg) scale(.85)}}
@-webkit-keyframes fly{0%{opacity:1;-webkit-transform:translate(0,0) rotate(0)}100%{opacity:1;-webkit-transform:translate(var(--x),var(--y)) rotate(540deg)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--x),var(--y)) rotate(540deg)}}
</style>
</head>
<body>
<div id="banner">OBRA ARTÍSTICA — FICÇÃO · não é uma urna real</div>
<div id="machine">
  <div id="screen">
    <h1>ELEIÇÃO · REPÚBLICA DE FAZ-DE-CONTA</h1>
    <div id="cargo">CARGO:<b>PRESIDENTE</b></div>
    <div id="digits"></div>
    <div id="msg">Digite o número do seu voto.</div>
    <div id="foot">Obra de ficção. Nenhum voto é registrado.</div>
  </div>
  <div id="pad">
    <div id="keys"></div>
    <div id="acts">
      <button class="a" id="bb">BRANCO</button>
      <button class="a" id="bc">CORRIGE</button>
      <button class="a" id="bo">CONFIRMA</button>
    </div>
  </div>
</div>

<div id="scene">
  <div id="flag">OBRA ARTÍSTICA — FICÇÃO</div>
  <div id="ground"></div>
  <div id="mapw"><div id="mapin" style="width:100%;height:100%">
    <svg viewBox="0 0 200 200">
      <polygon points="75,30 80,10 100,8 120,20 140,30 160,40 185,55 190,70 170,85 150,100 140,125 125,150 110,170 95,185 85,170 75,150 60,140 40,130 30,110 20,90 35,70 50,60 60,40" fill="#3fae4a" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      <g id="eyes">
        <circle cx="90" cy="85" r="14" fill="#fff" stroke="#111" stroke-width="3"/>
        <circle cx="122" cy="85" r="14" fill="#fff" stroke="#111" stroke-width="3"/>
        <circle cx="90" cy="87" r="5" fill="#111"/><circle cx="122" cy="87" r="5" fill="#111"/>
        <ellipse cx="106" cy="118" rx="9" ry="12" fill="#111"/>
      </g>
    </svg></div></div>
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div><div class="ring" id="r4"></div>
  <div id="bits"></div>
  <div id="boom">BOOM!</div>
  <div id="after"><span>Voto confirmado.</span></div>
</div>

<script>
(function(){
var MAX=2, val="", busy=false, timer=null;
var keys=document.getElementById("keys"), dg=document.getElementById("digits");
var msg=document.getElementById("msg"), scene=document.getElementById("scene");
function $(i){return document.getElementById(i);}
function beep(f,d){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 if(!window._ac)window._ac=new A();var o=_ac.createOscillator(),g=_ac.createGain();
 o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(_ac.destination);o.start();
 setTimeout(function(){o.stop();},d);}catch(e){}}
function draw(){var h="",i;for(i=0;i<MAX;i++){h+='<div class="d">'+(val.charAt(i)||"")+'</div>';}dg.innerHTML=h;}
function setMsg(t){msg.innerHTML=t;}
function reset(){val="";draw();setMsg("Digite o número do seu voto.");}
function press(n){
 if(busy||val.length>=MAX)return;
 val+=n;draw();beep(600+n*40,60);
 setMsg("Aguarde...");
 clearTimeout(timer);if(val.length>=MAX){timer=setTimeout(go,700);};
}
function confirmar(){
 if(busy)return;clearTimeout(timer);
 if(val.length===MAX){go();}else{setMsg("Número incompleto.");}
}
function go(){
 if(busy)return;busy=true;clearTimeout(timer);
 setMsg("Registrando voto...");beep(300,200);
 setTimeout(boom,300);
}
function boom(){
 var ids=["r1","r2","r3","r4","boom","after"],i,e;
 for(i=0;i<ids.length;i++){$(ids[i]).className=$(ids[i]).className.replace(/go\w/g,"");}
 scene.className="on";$("mapin").className="wob";
 // peças voando
 var b="",k,x,y;
 for(k=0;k<8;k++){x=Math.round(Math.cos(k*0.785)*55+(k%2?6:-6));y=Math.round(Math.sin(k*0.785)*50);
  b+='<div class="bit" style="--x:'+x+'vh;--y:'+y+'vh;-webkit-animation:fly .7s ease-out .1s forwards;animation:fly .7s ease-out .1s forwards;background:'+(k%2?"#3fae4a":"#f2c200")+'"></div>';}
 $("bits").innerHTML=b;
 // suspense: mapa tremendo e olhos arregalados
 setTimeout(function(){
  $("mapin").className="shake";
  setTimeout(function(){
   $("mapin").className="";
   $("r1").className="ring go1";$("r2").className="ring go2";$("r3").className="ring go3";$("r4").className="ring go4";
   $("boom").className="goB";$("after").className="goA";
   scene.className="on charred";beep(90,500);
   var s=document.body;s.className="";
  },450);
 },250);
 setTimeout(function(){
  scene.className="";busy=false;$("bits").innerHTML="";reset();
 },2900);
}
(function build(){
 var order=[1,2,3,4,5,6,7,8,9,0],h="",i;
 for(i=0;i<order.length;i++){
  h+='<div class="k"'+(order[i]===0?' style="margin-left:35%"':'')+'><button data-n="'+order[i]+'">'+order[i]+'</button></div>';
 }
 keys.innerHTML=h;
})();
function onKey(ev){
 var t=ev.target;
 if(t.getAttribute&&t.getAttribute("data-n")!==null){ev.preventDefault();press(parseInt(t.getAttribute("data-n"),10));}
}
keys.addEventListener("click",onKey,false);
$("bo").addEventListener("click",confirmar,false);
$("bc").addEventListener("click",function(){if(busy)return;clearTimeout(timer);reset();beep(250,80);},false);
$("bb").addEventListener("click",function(){
 if(busy)return;clearTimeout(timer);val="";draw();beep(450,80);
 setMsg("VOTO EM BRANCO");
 setTimeout(function(){if(!busy)reset();},2800);
},false);
reset();
})();
</script>
</body>
</html>
